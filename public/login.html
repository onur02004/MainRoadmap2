<!DOCTYPE html>
<html lang="en" data-theme="supabase-dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth Handshake // Sys-Cluster</title>
  
  <!-- FOUC Önleyici Hızlı Tema Yükleyici -->
  <script>
    (function() {
      const activeTheme = localStorage.getItem('app-theme') || 'supabase-dark';
      document.documentElement.setAttribute('data-theme', activeTheme);
      if (activeTheme !== 'supabase-dark' && activeTheme !== 'render-dark') {
        const link = document.createElement('link');
        link.id = 'dynamicThemeStyle';
        link.rel = 'stylesheet';
        link.href = `themes/${activeTheme}.css`;
        document.head.appendChild(link);
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 2;
    }

    .login-terminal-card {
      width: 100%;
      max-width: 440px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--app-radius, 8px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 30px var(--box-glow);
      overflow: hidden;
    }

    .card-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(0, 0, 0, 0.35);
      border-bottom: 1px solid var(--border-subtle);
    }

    .card-badge {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--accent-action);
      letter-spacing: 0.8px;
    }

    .status-ping {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--status-ok);
      box-shadow: 0 0 6px var(--status-ok);
    }

    .login-body {
      padding: 28px 24px;
    }

    .login-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 4px;
    }

    .login-sub {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--app-radius, 4px);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-color);
      color: var(--text-bright);
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input:focus {
      border-color: var(--accent-action);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn-handshake {
      width: 100%;
      padding: 12px;
      background: var(--accent-action);
      color: #000000;
      border: none;
      border-radius: var(--app-radius, 4px);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: filter 0.2s ease, transform 0.1s ease;
    }

    .btn-handshake:hover { filter: brightness(1.1); }
    .btn-handshake:active { transform: scale(0.98); }
    .btn-handshake:disabled { opacity: 0.5; cursor: not-allowed; }

    .alert-panel {
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 0.72rem;
      margin-bottom: 18px;
      display: none;
      border: 1px solid transparent;
    }

    .alert-panel.err {
      background: rgba(248, 81, 73, 0.1);
      border-color: var(--status-err);
      color: var(--status-err);
    }

    .alert-panel.ok {
      background: rgba(62, 207, 142, 0.1);
      border-color: var(--status-ok);
      color: var(--status-ok);
    }

    .login-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px dashed var(--border-subtle);
      font-size: 0.68rem;
    }

    .login-footer a {
      color: var(--text-dim);
      text-decoration: none;
    }
    .login-footer a:hover { color: var(--accent-action); }
  </style>
</head>
<body>

  <div class="fixed-background-grid-layer" id="bgGridLayer">
    <div class="render-corner-grid" id="cornerGrid"></div>
  </div>

  <main class="login-wrapper">
    <div class="login-terminal-card" id="loginCard">
      
      <div class="card-top-bar">
        <span class="card-badge">// SECURE_GATEWAY_V1</span>
        <span class="status-ping"></span>
      </div>

      <div class="login-body">
        <h1 class="login-title">&gt; CLUSTER_HANDSHAKE</h1>
        <p class="login-sub">Provide valid identity credentials to obtain JWT bearer cipher.</p>

        <div id="alertBox" class="alert-panel"></div>

        <form id="loginForm">
          <div class="form-group">
            <label for="identifier">IDENTIFIER (USERNAME OR EMAIL)</label>
            <input type="text" id="identifier" placeholder="e.g. onur or onur@sys.local" autocomplete="username" required />
          </div>

          <div class="form-group">
            <label for="password">CIPHER (PASSWORD)</label>
            <input type="password" id="password" placeholder="••••••••••••" autocomplete="current-password" required />
          </div>

          <button type="submit" id="submitBtn" class="btn-handshake">
            INITIATE HANDSHAKE
          </button>
        </form>

        <div class="login-footer">
          <a href="/">&larr; Return to Matrix</a>
          <span style="color: var(--text-dim);">STATUS: STANDBY</span>
        </div>
      </div>

    </div>
  </main>

  <script type="module">
    import { ThemeManager } from './themes/theme-registry.js';
    new ThemeManager();

    // 1. Zaten oturum açılmışsa /account'a aktar
    const activeToken = localStorage.getItem('token');
    if (activeToken) {
      try {
        const res = await fetch('/api/users/profile', {
          headers: { 'Authorization': `Bearer ${activeToken}` }
        });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
          window.location.replace('/account');
        } else {
          localStorage.removeItem('token');
        }
      } catch (err) {
        localStorage.removeItem('token');
      }
    }

    // 2. Form Giriş İşlemi
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerText = 'AUTHENTICATING...';
      showAlert('', false);

      try {
        const response = await fetch('/api/users/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password }),
        });

        const data = await response.json();

        if (response.ok && data.status === 'success') {
          localStorage.setItem('token', data.data.token);
          showAlert('[AUTH] Handshake verified. Forwarding...', true, 'ok');
          setTimeout(() => {
            window.location.replace('/account');
          }, 600);
        } else {
          showAlert(`[ERR] ${data.message || 'Invalid credentials.'}`, true, 'err');
        }
      } catch (error) {
        showAlert('[SYS_ERR] Connection to gateway refused.', true, 'err');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'INITIATE HANDSHAKE';
      }
    });

    function showAlert(msg, show, type = 'err') {
      if (!show) {
        alertBox.style.display = 'none';
        return;
      }
      alertBox.textContent = msg;
      alertBox.className = `alert-panel ${type}`;
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
