<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MainSite2 - Login</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }

        h2 { text-align: center; margin-bottom: 1.5rem; color: var(--primary); }

        .form-group { margin-bottom: 1.2rem; }

        input {
            width: 100%;
            padding: 0.8rem;
            margin-top: 0.5rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 0.8rem;
            background: var(--primary);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        #message { margin-top: 1rem; text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>MainSite2</h2>
    <form id="loginForm">
        <div class="form-group">
            <label>Email or Username</label>
            <input type="text" id="identifier" placeholder="onur_dev" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit">Sign In</button>
    </form>
    <div id="message"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msgDiv = document.getElementById('message');
        
        const payload = {
            identifier: document.getElementById('identifier').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('http://localhost:5000/api/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok) {
                msgDiv.style.color = '#4ade80';
                msgDiv.innerText = "Login Successful! Redirecting...";
                localStorage.setItem('token', result.data.token);
                // window.location.href = '/dashboard.html';
            } else {
                msgDiv.style.color = '#f87171';
                msgDiv.innerText = result.message || "Invalid credentials.";
            }
        } catch (err) {
            msgDiv.innerText = "Error connecting to server.";
        }
    });
</script>

</body>
</html>
